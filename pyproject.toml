[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopatch-crp"
version = "0.1.0"
description = "Contrastive Riemannian Prototype tissue classification, implemented against the GeoPatch DLPFC/v10x dataset."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "h5py>=3.10",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "scanpy>=1.10",
    "anndata>=0.10",
    "matplotlib>=3.8",
    "umap-learn>=0.5",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "pyarrow>=15.0",
    "byol-pytorch==0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["."]
